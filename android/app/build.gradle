plugins {
    id 'com.android.application'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore/keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'bh.pray.app'
    compileSdk 35

    defaultConfig {
        applicationId 'bh.pray.app'
        minSdk 26
        targetSdk 35
        versionCode 11
        versionName '0.1.5'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties['storeFile'] ?: 'keystore/pray-bh-upload.p12')
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias'] ?: 'pray-bh-upload'
                keyPassword keystoreProperties['keyPassword'] ?: keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
}
