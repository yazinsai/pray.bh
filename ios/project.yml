name: PrayBH
options:
  bundleIdPrefix: bh.pray
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    MARKETING_VERSION: "0.1.8"
    CURRENT_PROJECT_VERSION: "15"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 88M2R3XJZH
    CODE_SIGN_STYLE: Automatic
packages: {}
targets:
  PrayBH:
    type: application
    platform: iOS
    sources:
      - path: PrayBHApp
        excludes:
          - OnboardingMedia/**
      - path: PrayBHApp/OnboardingMedia
        buildPhase: resources
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: bh.pray.app
        INFOPLIST_FILE: PrayBHApp/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    infoPlist:
      properties:
        ITSAppUsesNonExemptEncryption: false
        LSApplicationQueriesSchemes:
          - whatsapp
    dependencies:
      - target: PrayBHWidgetExtension
  PrayBHWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: PrayBHWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: bh.pray.app.widget
        INFOPLIST_FILE: PrayBHWidget/Info.plist
        SKIP_INSTALL: true
  PrayBHMac:
    type: application
    platform: macOS
    sources:
      - path: PrayBHMac
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: bh.pray.app.mac
        INFOPLIST_FILE: PrayBHMac/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: pray.bh
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        LD_RUNPATH_SEARCH_PATHS: ["@executable_path/../Frameworks"]
        COMBINE_HIDPI_IMAGES: true
        GENERATE_INFOPLIST_FILE: false
    infoPlist:
      properties:
        CFBundleName: pray.bh
        CFBundleDisplayName: pray.bh
        LSUIElement: true
        ITSAppUsesNonExemptEncryption: false
        NSHighResolutionCapable: true
  PrayBHTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PrayBHTests
        excludes:
          - Info.plist
    dependencies:
      - target: PrayBH
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: bh.pray.app.tests
        INFOPLIST_FILE: PrayBHTests/Info.plist
