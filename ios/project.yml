name: PrayBH
options:
  bundleIdPrefix: bh.pray
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: B6CT95J3J5
    CODE_SIGN_STYLE: Automatic
packages: {}
targets:
  PrayBH:
    type: application
    platform: iOS
    sources:
      - path: PrayBHApp
        excludes:
          - Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: bh.pray.app
        INFOPLIST_FILE: PrayBHApp/Info.plist
    dependencies:
      - target: PrayBHWidgetExtension
  PrayBHWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: PrayBHWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: bh.pray.app.widget
        INFOPLIST_FILE: PrayBHWidget/Info.plist
        SKIP_INSTALL: true
