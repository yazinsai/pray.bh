name: PrayBH
options:
  bundleIdPrefix: bh.pray
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "0.1.5"
    CURRENT_PROJECT_VERSION: "11"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 88M2R3XJZH
    CODE_SIGN_STYLE: Automatic
packages: {}
targets:
  PrayBH:
    type: application
    platform: iOS
    sources:
      - path: PrayBHApp
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: bh.pray.app
        INFOPLIST_FILE: PrayBHApp/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    infoPlist:
      properties:
        ITSAppUsesNonExemptEncryption: false
    dependencies:
      - target: PrayBHWidgetExtension
  PrayBHWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: PrayBHWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: bh.pray.app.widget
        INFOPLIST_FILE: PrayBHWidget/Info.plist
        SKIP_INSTALL: true
  PrayBHTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PrayBHTests
        excludes:
          - Info.plist
    dependencies:
      - target: PrayBH
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: bh.pray.app.tests
        INFOPLIST_FILE: PrayBHTests/Info.plist
